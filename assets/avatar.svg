<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffe3f1"/>
      <stop offset="0.55" stop-color="#ffb3d1"/>
      <stop offset="1" stop-color="#c86bfa"/>
    </radialGradient>
    <linearGradient id="egg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a35cf0"/>
      <stop offset="0.6" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#3b0f7a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.5" stop-color="#f6c343"/>
      <stop offset="1" stop-color="#d9911a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee08a"/>
      <stop offset="1" stop-color="#22a447"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- конфетти-монетки -->
  <g fill="#fff" opacity="0.55">
    <circle cx="120" cy="150" r="9"/><circle cx="520" cy="470" r="7"/><circle cx="95" cy="430" r="6"/>
    <circle cx="545" cy="300" r="5"/><circle cx="180" cy="540" r="8"/>
  </g>

  <!-- баклажан -->
  <g transform="translate(300 345) rotate(-22)" filter="url(#shadow)">
    <path d="M0,-165 C62,-165 74,-70 94,15 C120,125 74,205 0,205 C-74,205 -120,125 -94,15 C-74,-70 -62,-165 0,-165 Z" fill="url(#egg)"/>
    <!-- блик -->
    <path d="M-48,-110 C-62,-60 -72,0 -70,60" stroke="#fff" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- шапочка -->
    <rect x="-9" y="-230" width="18" height="60" rx="9" fill="#2f8f43"/>
    <path d="M0,-180 C-30,-182 -62,-170 -78,-140 C-50,-150 -30,-142 -18,-128 C-12,-145 -4,-150 0,-150 C4,-150 12,-145 18,-128 C30,-142 50,-150 78,-140 C62,-170 30,-182 0,-180 Z" fill="url(#leaf)"/>
    <!-- лицо -->
    <g transform="translate(0 40)">
      <path d="M-58,-38 Q-38,-52 -18,-40" stroke="#1e0a3c" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M18,-44 Q38,-56 58,-36" stroke="#1e0a3c" stroke-width="7" stroke-linecap="round" fill="none"/>
      <ellipse cx="-36" cy="-8" rx="13" ry="16" fill="#1e0a3c"/>
      <ellipse cx="36" cy="-8" rx="13" ry="16" fill="#1e0a3c"/>
      <circle cx="-31" cy="-14" r="5" fill="#fff"/><circle cx="41" cy="-14" r="5" fill="#fff"/>
      <ellipse cx="-62" cy="22" rx="16" ry="9" fill="#ff7eb6" opacity="0.75"/>
      <ellipse cx="62" cy="22" rx="16" ry="9" fill="#ff7eb6" opacity="0.75"/>
      <path d="M-26,24 Q0,52 30,20" stroke="#1e0a3c" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- карта -->
  <g transform="translate(350 408) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="120" rx="16" fill="url(#gold)"/>
    <rect x="22" y="34" width="38" height="30" rx="6" fill="#c9861a" opacity="0.8"/>
    <path d="M22,49 H60 M41,34 V64" stroke="#fff1a8" stroke-width="3"/>
    <text x="22" y="100" font-family="Menlo, monospace" font-size="22" font-weight="700" fill="#7a4a06">•• 4269</text>
    <circle cx="150" cy="40" r="14" fill="#ef4444" opacity="0.85"/><circle cx="166" cy="40" r="14" fill="#f59e0b" opacity="0.85"/>
  </g>
  <!-- ручка, держащая карту -->
  <ellipse cx="370" cy="452" rx="26" ry="20" fill="#5b21b6" transform="rotate(-30 370 452)"/>

  <!-- уведомление -->
  <g transform="translate(470 150)" filter="url(#shadow)">
    <circle r="62" fill="#ef4444"/>
    <path d="M0,-34 C-22,-34 -30,-16 -30,4 L-30,16 L-40,28 H40 L30,16 L30,4 C30,-16 22,-34 0,-34 Z" fill="#fff"/>
    <circle cy="38" r="9" fill="#fff"/>
  </g>
</svg>
