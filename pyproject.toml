[project]
name = "subscription-reminder"
version = "0.1.0"
description = "Telegram bot + Mini App: напоминания о списаниях по подпискам"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "aiosqlite>=0.20,<1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
